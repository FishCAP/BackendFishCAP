services:
  postgres:
    image: postgres:16
    container_name: fishcap-db

    environment:
      POSTGRES_USER: fishcap_user
      POSTGRES_PASSWORD: fishcap123
      POSTGRES_DB: fishcap_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/:/docker-entrypoint-initdb.d/

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fishcap-api

    depends_on:
      - postgres

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: fishcap_user
      DATABASE_PASSWORD: fishcap123
      DATABASE_NAME: fishcap_db
      # The runtime image has no .env file, so the JWT secret MUST be injected
      # here. It must equal the JWT_SECRET used anywhere else (local dev .env,
      # jwt.strategy.ts fallback) or previously issued tokens will 401 forever.
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production}
      # Session token lifetime (read by auth.module.ts). 7d so an app session
      # survives normal use; re-login is only needed after a secret change,
      # an image redeploy that changed the secret, or manual logout.
      JWT_EXPIRES_IN: 7d
      # main.ts listens on PORT (default 3001). Expose that same port inside the
      # container and map host:3001 -> container:3001 so the Flutter client
      # (which connects to :3001) reaches the gateway's /ws endpoint.
      PORT: "3001"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@fishcap.app}

    ports:
      - "3001:3001"

volumes:
  postgres_data:
